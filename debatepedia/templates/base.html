<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Debatepedia</title>

  <meta property="og:title" content="Debatepedia">
  <meta property="og:description" content="A structured debate wiki for exploring topics, arguments, and evidence.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://debatepedia.vercel.app/">
  <meta property="og:image" content="https://debatepedia.vercel.app/static/images/debatepedia-preview.png">

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/debatepedia-preview.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/debatepedia-preview.png') }}">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.js"></script>

  <!-- HTML sanitiser -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar">☰</button>

    <div class="brand">
      <span class="mark"></span>
      Debatepedia
      <span class="sub">debate wiki</span>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="account" id="account"></div>
  </div>

  <div class="body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
